# AIXSILICON VIP Repository — Pull Request 流水线
# 依据 plan.md 第 11.1 节：
#   1. YAML/Schema/格式检查
#   2. 许可证与 SBOM 检查
#   3. FuseSoC Core 解析、依赖闭包与 VLNV 重复检查
#   4. Lint 与编译
#   5. 受影响 VIP 的 unit/smoke/negative 测试
#   6. RTM、Testplan 与 Coverage ID 完整性检查
#   7. 文档构建
#   8. 影响分析报告

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  metadata-schema:
    name: Metadata / Schema 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install pyyaml
      - name: Metadata 校验
        run: python3 tools/metadata_check/check_metadata.py --all
      - name: Testplan / Coverage / RTM 校验
        run: python3 tools/testplan_check/check_testplan.py --all
      - name: Catalog 导出（确保索引与 metadata 一致）
        run: python3 tools/catalog_export/export_catalog.py

  fusesoc-parse:
    name: FuseSoC Core 解析与 VLNV 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 FuseSoC
        run: pip install fusesoc
      - name: 解析所有 Core 与依赖闭包
        run: |
          fusesoc --cores-root=. list-cores
          fusesoc --cores-root=. core show aix:vip:common:1.0.0
          fusesoc --cores-root=. core show aix:vip:apb:1.0.0

  structure-lint:
    name: 结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查关键目录
        run: |
          for d in schema docs common protocol peripheral system safety \
                   adapters formal examples tests vendor tools catalog; do
            test -d "$d" || { echo "缺少目录 $d"; exit 1; }
          done
