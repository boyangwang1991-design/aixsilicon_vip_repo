# AXI VIP Metadata — 依据 schema/vip_metadata.schema.yaml
schema_version: "1.0"

vip:
  id: VIP-AXI-001
  name: axi
  vlnv: aix:vip:axi:1.0.0
  lifecycle: prototype
  owner: dv-platform
  license: Apache-2.0

protocol:
  family: AMBA
  name: AXI4
  revision: "ARM AMBA AXI Protocol Specification (IHI 0022), 受控内部位置: docs/spec_control.md"
  modes: [active_master, active_slave, passive]

capabilities:
  independent_read_write: true
  wait_state: true
  slave_error: true
  backpressure: true
  reset_interrupt: true
  xz_detection: true
  timeout: true
  ral_adapter: true
  multi_instance: true
  fixed_seed_reproducible: true
  outstanding: true
  out_of_order: true
  read_interleave: true
  narrow_transfer: true
  unaligned_transfer: true
  burst_4k_boundary: true

dependencies:
  - aix:vip:common:^1.0

tools:
  vcs: beta
  xcelium: beta
  questa: unsupported
  verilator: unsupported

quality:
  gate: V0_PROTOTYPE
  requirement_coverage: 0
  negative_test_pass_rate: 0

provenance:
  derived_from:
    - taichi-ishitani/tvip-axi@cd53d9275610438a1960e967b4b896c816d61ce6
  sbom: metadata/sbom.spdx.json
