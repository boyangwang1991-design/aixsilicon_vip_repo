schema_version: 1
requirements:
- id: AHB-SCP-001
  requirement: 必须提供 Manager Active、Subordinate Active、Passive 三种角色；Active 实例必须包含独立
    monitor。
  acceptance: T/I：三种角色分别运行；Passive 对所有总线信号零驱动。
  source_section: 2. 产品边界与协议剖面
  priority: P0
  target: 1.0.0
- id: AHB-SCP-002
  requirement: 必须将协议剖面、规范版次、角色、信号 presence、运行策略分开配置；不允许仅用一个 `ahb5_enable` 控制全部差异。
  acceptance: I/N：非法组合在 run 前失败并指出冲突字段。
  source_section: 2. 产品边界与协议剖面
  priority: P0
  target: 1.0.0
- id: AHB-SCP-003
  requirement: 必须支持单 Manager/单 Subordinate、单 Manager/多 Subordinate、多 Manager/多 Subordinate
    的测试环境组装。
  acceptance: T：分别验证寻址、响应路由和并发竞争。
  source_section: 2. 产品边界与协议剖面
  priority: P0
  target: 1.0.0
- id: AHB-SCP-004
  requirement: 多 Manager 的 AHB-Lite/AHB5 验证必须通过多实例及互联环境完成；每接口独立跟踪流水状态。
  acceptance: T：至少四 Manager、四 Subordinate，停顿互不串扰。
  source_section: 2. 产品边界与协议剖面
  priority: P0
  target: 1.0.0
- id: AHB-SCP-005
  requirement: 必须支持只读、只写、读写、仅 SINGLE、受限 HSIZE 等 DUT capability 描述；区分 DUT 不支持功能与协议非法流量。
  acceptance: T/N：合法但不支持的请求可发送，并验证 DUT 指定错误策略。
  source_section: 2. 产品边界与协议剖面
  priority: P0
  target: 1.0.0
- id: AHB-SCP-006
  requirement: 必须提供 capability 查询与导出，列明 supported/enabled/tested/unsupported，不允许以静默降级代替未支持报错。
  acceptance: I/N：配置、日志与测试清单一致。
  source_section: 2. 产品边界与协议剖面
  priority: P0
  target: 1.0.0
- id: AHB-SCP-007
  requirement: VIP 不承担 DUT CDC、缓存一致性、功能安全等级或系统原子性的自动证明；可通过观察插件和专用环境验证相关系统要求。
  acceptance: I：用户指南给出可观察性边界。
  source_section: 2. 产品边界与协议剖面
  priority: P0
  target: 1.0.0
- id: AHB-CFG-001
  requirement: 必须提供类型安全的 SystemVerilog interface、角色 modport 和采样/驱动时序契约；结构参数与运行配置分离。
  acceptance: I/T：合法参数编译、各角色接入参考 DUT。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-CFG-002
  requirement: 必须完整支持基础信号 HCLK、HRESETn、HADDR、HTRANS、HWRITE、HSIZE、HBURST、HPROT、HMASTLOCK、HWDATA、HRDATA、HREADY、HRESP，以及
    Subordinate 侧 HSEL/HREADYOUT。
  acceptance: I：按角色信号矩阵核对方向、宽度、presence。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-CFG-003
  requirement: 必须明确 HREADY 为本接口流水推进依据，HREADYOUT 为 Subordinate 响应输出；不得用当前地址 HSEL 直接决定当前数据响应归属。
  acceptance: T/N：A 等待时地址切换至 B，A 的数据响应仍归 A。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-CFG-004
  requirement: 必须支持 AHB5 的 HNONSEC、HEXCL、HMASTER、HEXOKAY，并与相关 property 联动。
  acceptance: T/N：所有启停组合和缺失信号配置检查。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-CFG-005
  requirement: 必须支持 Issue C 的 HWSTRB、HAUSER、HWUSER、HRUSER、HBUSER，以及已启用的全部 CHK 信号。
  acceptance: I/T：对照接口矩阵、宽度边界和零宽度配置。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-CFG-006
  requirement: 零宽度表示逻辑信号不存在，不得产生非法 SV 范围、幽灵驱动或误覆盖；内部占位实现不得泄漏到用户语义。
  acceptance: I/T：全关闭扩展配置可编译、运行。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-CFG-007
  requirement: 必须校验 feature dependency、参数范围、接口和 config 一致性；结构配置必须在 build 完成前冻结。
  acceptance: N：每类冲突至少一个反例。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-CFG-008
  requirement: 运行时允许调整随机分布、等待、错误策略和日志；影响当前事务的配置必须做事务快照，调整从后续事务生效。
  acceptance: T：等待期间更改配置不污染正在执行的 beat。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-CFG-009
  requirement: 必须配置地址区域、DUT 支持的 transfer size、读写权限、安全域和响应策略；重叠区域必须显式优先级或拒绝。
  acceptance: N/T：重叠、空洞、边界及优先级。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-CFG-010
  requirement: 同一仿真必须支持不同宽度、剖面和配置的 VIP 实例；不得使用未隔离的全局状态。
  acceptance: T：32-bit Lite 与 128-bit AHB5 混合运行。
  source_section: 3. 参数、接口与配置
  priority: P0
  target: 1.0.0
- id: AHB-TRN-001
  requirement: 必须同时提供 beat 级事务和 burst 级聚合；可分别发布周期事件、地址接受事件、完成事件和诊断事件。
  acceptance: T：逐周期参考轨迹与事件一一对齐。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-TRN-002
  requirement: 请求必须包含方向、起始地址、HSIZE、HBURST、数据列表、属性、BUSY/IDLE 插入计划及用户 tag。
  acceptance: I/T：序列 API 可直接表达各类请求。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-TRN-003
  requirement: 扩展请求必须包含 security、exclusive、manager identity、user、write strobe 与故障计划；字段有效性由剖面判定。
  acceptance: N：禁用特性字段不得被静默忽略。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-TRN-004
  requirement: 完成记录必须包含读数据、逐 beat HRESP/HEXOKAY、等待周期、地址接受/完成时间、实际地址及终止原因。
  acceptance: T：错误位于首/中/末 beat 时结果精确。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-TRN-005
  requirement: 必须分别表示 OKAY、ERROR、EXCLUSIVE_FAIL、RESET_ABORT、WATCHDOG、CANCEL_BEFORE_ACCEPT
    和经典 RETRY/SPLIT；协议响应与 VIP 状态不得共用含糊编码。
  acceptance: T：上层调用能无歧义处理每个结果。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-TRN-006
  requirement: 必须区分 requested、offered、accepted、completed、aborted 生命周期；未接受的流水候选不能计入成功完成。
  acceptance: T：ERROR、复位和撤销场景无重复或伪事务。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-TRN-007
  requirement: 必须提供同步 read/write、异步提交、等待完成、burst、exclusive pair 和用户自定义 sequence 接口。
  acceptance: T：同一场景可由高级 API 和 beat API 等价执行。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-TRN-008
  requirement: 回调至少覆盖请求合法性调整、地址驱动前、响应选择、数据生成、事务完成和故障注入；回调时序与所有权必须文档化。
  acceptance: I/T：回调不会绕过 monitor，无法事后篡改已发布事务。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-TRN-009
  requirement: 必须实现深拷贝、比较、打印和事务记录；数组、扩展对象、四态值不得丢失。
  acceptance: T：复制后修改原事务不会影响已发布记录。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-TRN-010
  requirement: 内部 transaction ID 只用于调试与关联；不能假设 AHB 总线携带该 ID 或支持乱序返回。
  acceptance: I/T：长软件队列仍按接口实际顺序完成。
  source_section: 4. 事务模型与公开 API
  priority: P0
  target: 1.0.0
- id: AHB-BAS-001
  requirement: 必须支持所有配置数据宽度下的单次读写、窄传输和满宽传输。
  acceptance: T/C：方向×宽度×合法 HSIZE。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BAS-002
  requirement: 必须按 HCLK 采样边沿建立地址阶段与后续数据阶段的对应关系。
  acceptance: T：读写交替、不同地址连续访问不串拍。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BAS-003
  requirement: 零等待且请求充足时，普通传输必须达到稳态每 HCLK 完成一个 beat，不得因 UVM item 握手强制插空。
  acceptance: P/T：连续 256 beat，填充/排空之外无 VIP 引入气泡。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BAS-004
  requirement: 必须根据有效地址接受条件采纳请求；Subordinate 监测应包含 HSEL、HREADY 与有效 HTRANS 判断。
  acceptance: T：未选中、IDLE、BUSY 和 HREADY 低时不产生新有效 beat。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BAS-005
  requirement: 地址、写数据、读数据和响应必须按各自阶段跟踪；后续地址不得覆盖当前写数据的地址与属性。
  acceptance: T：每拍不同 HSIZE/方向/目标，随机停顿，逐字节比对。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BAS-006
  requirement: 必须支持 IDLE/NONSEQ/SEQ/BUSY 的合法组合；IDLE/BUSY 不产生实际存储访问。
  acceptance: T/A：检查 memory callback 次数与有效 beat 数相等。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BAS-007
  requirement: 必须支持等待期间规范允许的 IDLE/BUSY 转换；checker 不得使用“所有信号在 HREADY 低时一律稳定”的简化规则。
  acceptance: T/N/A：合法变化零误报，违反有效阶段保持规则必报。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BAS-008
  requirement: 必须支持普通等待期间写数据保持，读数据仅在相应有效完成条件下采信；ERROR 等例外按版本规则处理。
  acceptance: T/N：非有效读周期随机变化不误报；有效拍损坏可检出。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BAS-009
  requirement: 必须覆盖 R→R、R→W、W→R、W→W 连续传输及各组合中的等待。
  acceptance: T/C：四种切换×0/1/多等待。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BAS-010
  requirement: 对没有协议定义最大等待的场景，必须把过长等待报告为环境 watchdog/policy，不得宣称违反 AHB 固有 timeout。
  acceptance: T：关闭 watchdog 可持续等待；开启后按指定原因终止测试。
  source_section: 5. 基础传输与流水
  priority: P0
  target: 1.0.0
- id: AHB-BST-001
  requirement: 必须生成和识别 SINGLE、INCR、INCR4/8/16、WRAP4/8/16；固定长度按有效数据 beat 计数。
  acceptance: T/C：全部 HBURST×读写。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-002
  requirement: INCR 必须支持用户指定有限长度及动态结束；资源保护上限属于生成器策略，monitor 不得因正常长 burst 溢出。
  acceptance: T：1、2、3、17、256、1024 beat，必要时分割合法边界。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-003
  requirement: Burst 地址模型必须独立检查增量与 wrap；WRAP 起点可位于 wrap 窗口内任一合法 beat 地址，不得强制从窗口基址开始。
  acceptance: T/N：每个 wrap 起点偏移及错误回绕地址。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-004
  requirement: 必须对自然对齐、HSIZE 与总线宽度关系、增量 burst 的 1KB 边界约束做合法性检查。
  acceptance: T/N：边界前最后合法传输及故意跨界。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-005
  requirement: 高层大块访问 API 可按 1KB 边界及 DUT 能力拆分请求；底层 raw API 不得悄悄修正负向测试流量。
  acceptance: T：拆分后数据、地址和字节数守恒。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-006
  requirement: 必须支持 burst 内可配置数量和位置的 BUSY，并检查固定/未定长 burst 的不同终止规则。
  acceptance: T/N：首个有效拍之后、内部、尾部边界，合法与非法对照。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-007
  requirement: 必须检查 burst 内应保持的属性和 SEQ 地址关系；错误、复位、互联打断等合法上下文不应被当作普通序列损坏。
  acceptance: T/A：明确终止原因后重新 NONSEQ 启动。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-008
  requirement: 必须允许 Subordinate 侧看到被互联拆分或提前终止的 burst，并记录实际观察长度；是否违规依观察点和可见上下文判断。
  acceptance: T：互联两侧轨迹不同仍能正确比对。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-009
  requirement: 必须为全部 endian 模式定义地址到 byte lane 的映射；参考模型统一以字节地址存储。
  acceptance: T：每个合法 lane、HSIZE、多宽度读回。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-010
  requirement: 数据比对应使用有效 byte mask 和 valid mask；不能强制未用数据 lane 为零，也不能在未知有效数据上以二态比较判成功。
  acceptance: T/N：无效 lane 随机/X 不误报；有效 lane X 可诊断。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-BST-011
  requirement: 不得宣称基础 AHB 支持任意 unaligned 单笔传输；高层非对齐访问只能显式拆成合法访问并暴露拆分结果。
  acceptance: T/N：raw 非对齐被识别，高层拆分可读回。
  source_section: 6. Burst、地址与字节映射
  priority: P0
  target: 1.0.0
- id: AHB-RSP-001
  requirement: Subordinate 必须支持零等待、固定等待、随机等待及脚本化逐 beat 等待。
  acceptance: T/C：等待 0、1、2、15、256 和随机长尾。
  source_section: 7. 响应、错误与恢复
  priority: P0
  target: 1.0.0
- id: AHB-RSP-002
  requirement: 必须支持 OKAY 和符合剖面时序的 ERROR；AHB-Lite/AHB5 ERROR 包含两周期响应过程，不能实现为普通单周期错误脉冲。
  acceptance: T/N/A：正确、缺少首周期、缺少完成周期均有测试。
  source_section: 7. 响应、错误与恢复
  priority: P0
  target: 1.0.0
- id: AHB-RSP-003
  requirement: 必须允许 ERROR 前插入普通等待，区分普通等待与错误响应阶段。
  acceptance: T：0/1/多前置等待，错误只完成一次。
  source_section: 7. 响应、错误与恢复
  priority: P0
  target: 1.0.0
- id: AHB-RSP-004
  requirement: Manager 必须正确处理 ERROR 对流水候选地址的取消/继续；提供停止剩余 burst 与按协议继续的策略。
  acceptance: T：错误首/中/末拍，两策略下记录无丢失、无重复。
  source_section: 7. 响应、错误与恢复
  priority: P0
  target: 1.0.0
- id: AHB-RSP-005
  requirement: 必须支持地址、方向、HSIZE、属性、beat 索引、概率、次数与用户回调触发 ERROR。
  acceptance: T：每种触发命中精确，固定 seed 可复现。
  source_section: 7. 响应、错误与恢复
  priority: P0
  target: 1.0.0
- id: AHB-RSP-006
  requirement: 错误写入副作用必须使用显式模型策略；默认 memory model 不提交失败写，但 checker 不得据此认定所有 DUT 错误写均无副作用。
  acceptance: T：默认策略与设备回调策略分别验证。
  source_section: 7. 响应、错误与恢复
  priority: P0
  target: 1.0.0
- id: AHB-RSP-007
  requirement: 默认目标模型必须区分有效未映射访问和 IDLE/BUSY；前者执行配置的错误策略，后者不制造虚假访问错误。
  acceptance: T：空洞访问、空闲与 BUSY。
  source_section: 7. 响应、错误与恢复
  priority: P0
  target: 1.0.0
- id: AHB-RSP-008
  requirement: 连续错误、错误后正确访问、等待中错误、错误中复位必须恢复到一致状态。
  acceptance: T：后续 100 个正确访问全部匹配。
  source_section: 7. 响应、错误与恢复
  priority: P0
  target: 1.0.0
- id: AHB-LCK-001
