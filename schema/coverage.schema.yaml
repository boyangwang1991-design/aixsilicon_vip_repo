# Coverage Schema (draft-07 / 2020-12 兼容)
# 用于校验 coverage 计划与覆盖点定义，Coverage ID 需关联 Requirement / Test ID。
$schema: http://json-schema.org/draft-07/schema#
$id: https://aixsilicon.com/schema/coverage.schema.yaml
title: AIXSILICON Coverage Plan
description: 描述 VIP 的功能覆盖计划、覆盖点与命中门限。
type: object
required:
  - schema_version
  - vip_vlnv
  - coverage_groups
properties:
  schema_version:
    type: string
    const: "1.0"
  vip_vlnv:
    type: string
  coverage_groups:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, name, goal, points]
      properties:
        id:
          type: string
          pattern: "^COV-[A-Z0-9]+-[0-9]{3,}$"
          description: 稳定 Coverage ID，如 COV-APB-001。
        name:
          type: string
        goal:
          type: integer
          minimum: 0
          maximum: 100
          description: 命中门限（%）。
        requirement_ids:
          type: array
          items:
            type: string
          description: 关联 Requirement ID。
        test_ids:
          type: array
          items:
            type: string
          description: 关联 Test ID。
        points:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
                enum: [coverpoint, cross, transition]
              kind:
                type: string
                description: 如 transition/address/burst/size/backpressure/error。
              bins:
                type: integer
              description:
                type: string
additionalProperties: true
