# Release Manifest Schema (draft-07 / 2020-12 兼容)
# 用于校验每个 VIP 的 metadata/release_manifest.yaml。
$schema: http://json-schema.org/draft-07/schema#
$id: https://aixsilicon.com/schema/release_manifest.schema.yaml
title: AIXSILICON Release Manifest
description: 描述一次正式发布的版本、依赖锁定、质量证据、SBOM 与发布产物。
type: object
required:
  - schema_version
  - release
  - artifacts
  - evidence
properties:
  schema_version:
    type: string
    const: "1.0"
  release:
    type: object
    required: [vlnv, version, date, lifecycle, changelog_ref]
    properties:
      vlnv:
        type: string
      version:
        type: string
        pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$"
        description: SemVer。
      date:
        type: string
        format: date
      lifecycle:
        type: string
        enum: [prototype, alpha, beta, qualified, proven]
      changelog_ref:
        type: string
      tag:
        type: string
  dependencies:
    type: object
    additionalProperties:
      type: string
    description: 依赖 VLNV → 锁定版本/commit。
  tools:
    type: object
    additionalProperties:
      type: object
      properties:
        version:
          type: string
        result:
          type: string
    description: 各仿真器/工具版本与结果。
  artifacts:
    type: array
    items:
      type: object
      required: [name, type, hash]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [tarball, core, sbom, report, documentation]
        hash:
          type: string
          description: SHA-256。
        size_bytes:
          type: integer
  evidence:
    type: object
    required: [requirement_coverage, planned_test_pass_rate, gate]
    properties:
      requirement_coverage:
        type: integer
        minimum: 0
        maximum: 100
      planned_test_pass_rate:
        type: integer
        minimum: 0
        maximum: 100
      negative_test_pass_rate:
        type: integer
        minimum: 0
        maximum: 100
      mutation_test_pass_rate:
        type: integer
        minimum: 0
        maximum: 100
      gate:
        type: string
        enum: [V0_PROTOTYPE, V1_ALPHA, V2_BETA, V3_QUALIFIED, V4_PROVEN]
      regression_summary:
        type: string
        description: 回归摘要或报告路径。
  sbom:
    type: string
    description: SBOM 文件路径，如 metadata/sbom.spdx.json。
additionalProperties: true
