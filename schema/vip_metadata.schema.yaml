# VIP Metadata Schema (draft-07 / 2020-12 兼容)
# 用于校验每个 VIP 的 metadata/vip.yaml
$schema: http://json-schema.org/draft-07/schema#
$id: https://aixsilicon.com/schema/vip_metadata.schema.yaml
title: AIXSILICON VIP Metadata
description: 描述一个 VIP 的标识、协议、能力、依赖、工具支持、质量等级与来源。
type: object
required:
  - schema_version
  - vip
  - protocol
  - capabilities
  - dependencies
  - tools
  - quality
properties:
  schema_version:
    type: string
    const: "1.0"
    description: 本 Schema 的版本。
  vip:
    type: object
    required: [id, name, vlnv, lifecycle, owner, license]
    properties:
      id:
        type: string
        pattern: "^VIP-[A-Z0-9]+-[0-9]{3}$"
        description: 唯一标识，如 VIP-AXI-001。
      name:
        type: string
        description: VIP 短名，如 axi。
      vlnv:
        type: string
        pattern: "^[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[0-9]+\\.[0-9]+\\.[0-9]+$"
        description: 形式 aix:vip:<name>:<semver>。
      lifecycle:
        type: string
        enum: [prototype, alpha, beta, qualified, proven, deprecated]
      owner:
        type: string
      license:
        type: string
        description: SPDX 表达式，如 Apache-2.0。
  protocol:
    type: object
    required: [family, name, revision, modes]
    properties:
      family:
        type: string
        description: 协议族，如 AMBA。
      name:
        type: string
        description: 协议名，如 AXI4。
      revision:
        type: string
        description: 受控环境中记录的规范标识，禁止写 latest。
      modes:
        type: array
        items:
          type: string
          enum: [active_master, active_slave, passive, disabled]
  capabilities:
    type: object
    additionalProperties:
      type: [boolean, string]
    description: 能力布尔或 planned/true/false，如 outstanding、out_of_order 等。
  dependencies:
    type: array
    items:
      type: string
      description: VLNV 依赖，支持 ^ 语义化范围，如 aix:vip:common:^1.0。
  tools:
    type: object
    additionalProperties:
      type: string
      enum: [qualified, beta, unsupported]
    description: 仿真器兼容状态，如 vcs/xcelium/questa/verilator。
  quality:
    type: object
    required: [gate]
    properties:
      gate:
        type: string
        enum: [V0_PROTOTYPE, V1_ALPHA, V2_BETA, V3_QUALIFIED, V4_PROVEN]
      requirement_coverage:
        type: integer
        minimum: 0
        maximum: 100
      negative_test_pass_rate:
        type: integer
        minimum: 0
        maximum: 100
  provenance:
    type: object
    properties:
      derived_from:
        type: array
        items:
          type: string
        description: 来源开源项目与 commit，如 lowRISC/opentitan@<hash>。
      sbom:
        type: string
        description: SBOM 文件路径，如 metadata/sbom.spdx.json。
additionalProperties: true
